services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ai-studio-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_product_studio
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./context/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-studio-network

  # Orchestrator Backend
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    container_name: ai-studio-orchestrator
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ai_product_studio
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-2000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://ollama:11434}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-studio-network
    restart: unless-stopped

  # Frontend UI
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: ai-studio-ui
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - orchestrator
    networks:
      - ai-studio-network
    restart: unless-stopped

  # Ollama (optional - for local LLM support)
  ollama:
    image: ollama/ollama:latest
    container_name: ai-studio-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - ai-studio-network
    restart: unless-stopped
    # Comment out if you don't want to use Ollama
    profiles:
      - ollama

networks:
  ai-studio-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
